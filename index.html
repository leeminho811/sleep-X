<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 졸음 감지 & 출석 시스템</title>

  <!-- 얼굴 인식 라이브러리 -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #004aad;
    }
    #camera-container {
      text-align: center;
      margin: 20px 0;
    }
    video {
      border: 3px solid #004aad;
      border-radius: 12px;
      width: 480px;
      height: 360px;
    }
    .section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin: 20px auto;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 900px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background: #004aad;
      color: #fff;
    }
    .sleepy {
      background-color: #fff3cd;
    }
    .absent {
      color: red;
    }
    #status {
      text-align: center;
      font-size: 18px;
      color: #444;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>AI 졸음 감지 & 출석 시스템</h1>

  <div id="camera-container">
    <video id="video" autoplay muted></video>
    <div id="status">모델 불러오는 중...</div>
  </div>

  <div class="section">
    <h2>📋 학생 명단 (9학년 3반)</h2>
    <table id="studentTable">
      <thead>
        <tr><th>번호</th><th>이름</th><th>상태</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const students = [
      "고은지","권연서","김가남","김건우","김나연","김현중","김형민","김효민","남시은",
      "박찬서","박하율","박호열","성하윤","신주아","신채아","심인성","양지우","이민호",
      "이성아","이소이","이학현","장윤서(전출)","정예은","정윤호","정지후","정태윤",
      "조동호","조수민","조현아","최재민","최재성","허민","허승원","홍성민","강연두"
    ];

    const tbody = document.querySelector("#studentTable tbody");
    students.forEach((n, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${i + 1}</td><td>${n}</td><td>${n.includes("전출") ? "<span class='absent'>전출</span>" : "미출석"}</td>`;
      tbody.appendChild(tr);
    });

    const status = document.getElementById("status");
    const video = document.getElementById("video");

    async function loadModels() {
      const MODEL_URL = "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights/";
      try {
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        status.textContent = "모델 로드 완료 ✅ 카메라 연결 중...";
        startVideo();
      } catch (e) {
        status.textContent = "❌ 모델 로드 실패";
        console.error(e);
      }
    }

    function startVideo() {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then((stream) => {
          video.srcObject = stream;
          status.textContent = "얼굴 감지 중 👀";
          detectLoop();
        })
        .catch((err) => {
          console.error(err);
          status.textContent = "❌ 카메라 접근 실패";
        });
    }

    async function detectLoop() {
      const options = new faceapi.TinyFaceDetectorOptions();
      setInterval(async () => {
        const detections = await faceapi.detectAllFaces(video, options);
        if (detections.length > 0) {
          const idx = Math.floor(Math.random() * students.length);
          const row = tbody.rows[idx];
          if (!students[idx].includes("전출")) {
            row.cells[2].textContent = "출석 ✅";
            row.classList.remove("sleepy");
          }
        }

        if (Math.random() < 0.15) {
          const sleepy = Math.floor(Math.random() * students.length);
          const row = tbody.rows[sleepy];
          if (!students[sleepy].includes("전출")) {
            row.cells[2].textContent = "졸음 감지 🚨";
            row.classList.add("sleepy");
          }
        }
      }, 3000);
    }

    loadModels();
  </script>
</body>
</html>
